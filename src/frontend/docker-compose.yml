version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    volumes:
      # Para desarrollo, montar el código fuente
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        if [ ! -d node_modules ]; then
          npm install
        fi &&
        npm start
      "
    networks:
      - ocr-network

  # Servicio para desarrollo con hot reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - ocr-network

networks:
  ocr-network:
    external: true

